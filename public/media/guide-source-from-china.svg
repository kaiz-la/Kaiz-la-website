<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The China sourcing process: specification, suppliers, samples, negotiation, inspection and shipping">
  <defs>
    <!-- Brand "western sun" gradient: crimson-deep to crimson to sun-orange -->
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1104" y2="0">
      <stop offset="0%" stop-color="#9e1f1e"/>
      <stop offset="38%" stop-color="#cc3433"/>
      <stop offset="98%" stop-color="#f97733"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf7f3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f97733" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#cc3433" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#cc3433" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <!-- the sun setting in the west, low and to the right -->
  <circle cx="1010" cy="250" r="330" fill="url(#glow)"/>

  <!-- freight watermark: stacked containers, barely there -->
  <g opacity="0.07" fill="none" stroke="#1a1413" stroke-width="3">
    <rect x="880" y="212" width="150" height="56" rx="5"/>
    <rect x="920" y="152" width="150" height="56" rx="5"/>
    <path d="M880 240h150M920 180h150"/>
  </g>

  <!-- crimson seal, echoing the wordmark mark -->
  <rect x="96" y="76" width="34" height="34" rx="9" fill="url(#sun)"/>

  <text x="150" y="99" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="3.4" fill="#cc3433">SOURCING 101</text>

  <text x="96" y="216" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="500" fill="#1a1413">How to source</text>
  <text x="96" y="298" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="500" fill="#1a1413">products from <tspan fill="#cc3433">China</tspan></text>

  <text x="96" y="352" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="25" fill="#4a3f3d">A twelve-step guide, from spec sheet to delivered pallet.</text>

  <!-- process line -->
  <path d="M126 468H1074" stroke="url(#sun)" stroke-width="4" stroke-linecap="round"/>

  <!-- six stages -->
  <g font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="126" cy="468" r="31" fill="#ffffff" stroke="#cc3433" stroke-width="4"/>
      <text x="126" y="477" font-size="26" font-weight="700" fill="#cc3433">1</text>
      <text x="126" y="538" font-size="22" font-weight="600" fill="#1a1413">Spec</text>
      <text x="126" y="566" font-size="17" fill="#7d7068">Define it</text>
    </g>
    <g>
      <circle cx="316" cy="468" r="31" fill="#ffffff" stroke="#cc3433" stroke-width="4"/>
      <text x="316" y="477" font-size="26" font-weight="700" fill="#cc3433">2</text>
      <text x="316" y="538" font-size="22" font-weight="600" fill="#1a1413">Suppliers</text>
      <text x="316" y="566" font-size="17" fill="#7d7068">Find &amp; compare</text>
    </g>
    <g>
      <circle cx="506" cy="468" r="31" fill="#ffffff" stroke="#cc3433" stroke-width="4"/>
      <text x="506" y="477" font-size="26" font-weight="700" fill="#cc3433">3</text>
      <text x="506" y="538" font-size="22" font-weight="600" fill="#1a1413">Verify</text>
      <text x="506" y="566" font-size="17" fill="#7d7068">Licence &amp; factory</text>
    </g>
    <g>
      <circle cx="696" cy="468" r="31" fill="#ffffff" stroke="#cc3433" stroke-width="4"/>
      <text x="696" y="477" font-size="26" font-weight="700" fill="#cc3433">4</text>
      <text x="696" y="538" font-size="22" font-weight="600" fill="#1a1413">Sample</text>
      <text x="696" y="566" font-size="17" fill="#7d7068">Then negotiate</text>
    </g>
    <g>
      <circle cx="886" cy="468" r="31" fill="#ffffff" stroke="#cc3433" stroke-width="4"/>
      <text x="886" y="477" font-size="26" font-weight="700" fill="#cc3433">5</text>
      <text x="886" y="538" font-size="22" font-weight="600" fill="#1a1413">Inspect</text>
      <text x="886" y="566" font-size="17" fill="#7d7068">Before it ships</text>
    </g>
    <g>
      <circle cx="1074" cy="468" r="31" fill="url(#sun)"/>
      <path d="M1062 468l8 9 17-18" stroke="#ffffff" stroke-width="4.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1074" y="538" font-size="22" font-weight="600" fill="#1a1413">Delivered</text>
      <text x="1074" y="566" font-size="17" fill="#7d7068">Cleared &amp; landed</text>
    </g>
  </g>

  <text x="1104" y="99" text-anchor="end" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="3.4" fill="#1a1413">KAIZ LA</text>
</svg>
